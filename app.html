<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  >

  <title>NEUERO Messe-App</title>

  <link rel="manifest" href="./manifest.json">

  <meta name="theme-color" content="#020617">

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Mühle + Filter"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100vh;
      height: 100vh;

      margin: 0;
      padding: 0;

      overflow: hidden;
      background: #111827;

      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    .app-shell {
      position: fixed;
      inset: 0;

      width: 100vw;
      min-height: 100vh;
      height: 100vh;

      display: flex;
      flex-direction: column;

      margin: 0;
      padding: 0;

      background: #020617;
      overflow: hidden;
    }


    .product-tabs {
      position: relative;
      z-index: 20;

      flex: 0 0 auto;

      width: 90%;
      margin:
        calc(16px + env(safe-area-inset-top))
        auto
        -21.5px;

      padding-right: 125px;

      display: flex;
      align-items: flex-end;
      gap: 6px;
    }

    .product-tab {
      position: relative;
      flex: 1;
      min-width: 0;
      height: 48px;
      min-height: 48px;
      padding: 9px 4px 7px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: none;
      border-radius: 16px 16px 0 0;

      background: #1a2944;
      color: rgba(255, 255, 255, 0.55);

      font-family: inherit;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.1;
      text-align: center;

      appearance: none;
      -webkit-appearance: none;

      box-shadow:
        inset 0 8px 14px rgba(0, 0, 0, 0),
        inset 0 -4px 8px rgba(0, 0, 0, 0.18);
    }

    .product-tab::before {
      content: "";
      position: absolute;
      top: -7px;
      left: 17px;
      width: 42%;
      height: 10px;
      border-radius: 10px 10px 0 0;
      background: inherit;
    }

    .product-tab.active {
     z-index: 3;

      height: 58px;
      min-height: 58px;

      background: #004388;
      color: #ffe843;

      font-size: 26px;
      font-weight: 700;

      box-shadow: none;
    }

    .product-tab:not(.active):active {
      transform: scale(0.98);
    }

    .language-switch {
      position: absolute;
      top: calc(14px + env(safe-area-inset-top));
      right: 18px;
      z-index: 20;

      display: flex;
      gap: 4px;
      padding: 4px;

      border-radius: 16px;
      background: rgba(2, 6, 23, 0.82);
    }

    .language-button {
      min-width: 52px;
      height: 42px;
      border: none;
      border-radius: 12px;
      background: transparent;
      color: white;
      font-size: 16px;
      font-weight: 700;
    }

    .language-button.active {
      background: #ffe843;
      color: #004388;
    }

    .product-frame {
      position: relative;
      z-index: 1;

      flex: 1 1 0;
      width: 100%;
      min-width: 0;
      min-height: 0;

      display: block;

      margin: 0;
      padding: 0;

      border: 0;
      border-radius: 0;

      background: #020617;
    }
  </style>
</head>

<body>
  <div class="app-shell">

    <nav
      class="product-tabs"
      aria-label="Gerät auswählen"
    >
      <button
        id="tabRvo"
        class="product-tab active"
        type="button"
        onclick="showProduct('rvo')"
      >
        <span class="tab-de">Hammermühle RVO</span>
        <span class="tab-en" hidden>Hammer Mill RVO</span>
      </button>

      <button
        id="tabJet"
        class="product-tab"
        type="button"
        onclick="showProduct('jet')"
      >
        <span class="tab-de">JET-Filter</span>
        <span class="tab-en" hidden>JET Filter</span>
      </button>
    </nav>

    <div class="language-switch">
      <button
        id="languageDe"
        class="language-button active"
        type="button"
        onclick="setShellLanguage('de')"
      >
        DE
      </button>

      <button
        id="languageEn"
        class="language-button"
        type="button"
        onclick="setShellLanguage('en')"
      >
        EN
      </button>
    </div>

    <iframe
      id="productFrame"
      class="product-frame"
      src="./index.html?embedded=1"
      title="NEUERO Produktinformationen"
    ></iframe>

  </div>

<script>
  let currentProduct = "rvo";

  let currentLanguage =
    sessionStorage.getItem("messe-language") === "en"
      ? "en"
      : "de";

  const productFrame =
    document.getElementById("productFrame");

  const tabRvo =
    document.getElementById("tabRvo");

  const tabJet =
    document.getElementById("tabJet");

  const languageDe =
    document.getElementById("languageDe");

  const languageEn =
    document.getElementById("languageEn");


  function sendLanguageToFrame() {
    if (
      productFrame &&
      productFrame.contentWindow
    ) {
      productFrame.contentWindow.postMessage(
        {
          type: "set-language",
          language: currentLanguage
        },
        window.location.origin
      );
    }
  }


  function showProduct(product) {
    if (
      product !== "rvo" &&
      product !== "jet"
    ) {
      return;
    }

    if (product === currentProduct) {
      return;
    }

    currentProduct = product;

    tabRvo.classList.toggle(
      "active",
      product === "rvo"
    );

    tabJet.classList.toggle(
      "active",
      product === "jet"
    );

    tabRvo.setAttribute(
      "aria-current",
      product === "rvo"
        ? "page"
        : "false"
    );

    tabJet.setAttribute(
      "aria-current",
      product === "jet"
        ? "page"
        : "false"
    );

    if (product === "rvo") {
      productFrame.src =
        "./index.html?embedded=1";
    } else {
      productFrame.src =
        "./jet-filter.html?embedded=1";
    }
  }


  function setShellLanguage(language) {
    if (
      language !== "de" &&
      language !== "en"
    ) {
      return;
    }

    currentLanguage = language;

    sessionStorage.setItem(
      "messe-language",
      language
    );

    document.documentElement.lang =
      language;

    languageDe.classList.toggle(
      "active",
      language === "de"
    );

    languageEn.classList.toggle(
      "active",
      language === "en"
    );

    document
      .querySelectorAll(".tab-de")
      .forEach(function (element) {
        element.hidden =
          language !== "de";
      });

    document
      .querySelectorAll(".tab-en")
      .forEach(function (element) {
        element.hidden =
          language !== "en";
      });

    sendLanguageToFrame();
  }


  productFrame.addEventListener(
    "load",
    function () {
      sendLanguageToFrame();
    }
  );


  window.addEventListener(
    "load",
    function () {
      setShellLanguage(
        currentLanguage
      );
    }
  );

  window.addEventListener(
    "message",
    function (event) {
      if (
        event.origin !==
        window.location.origin
      ) {
        return;
      }

      if (
        event.data &&
        event.data.type === "reset-app"
      ) {
        currentProduct = "rvo";
        currentLanguage = "de";

        sessionStorage.setItem(
          "messe-language",
          "de"
        );

        tabRvo.classList.add("active");
        tabJet.classList.remove("active");

        tabRvo.setAttribute(
          "aria-current",
          "page"
        );

        tabJet.setAttribute(
          "aria-current",
          "false"
        );

        languageDe.classList.add("active");
        languageEn.classList.remove("active");

        document
          .querySelectorAll(".tab-de")
          .forEach(function (element) {
            element.hidden = false;
          });

        document
          .querySelectorAll(".tab-en")
          .forEach(function (element) {
            element.hidden = true;
          });

        document.documentElement.lang = "de";

        productFrame.src =
          "./index.html?embedded=1";
      }
    }
  );


  if ("serviceWorker" in navigator) {
    window.addEventListener(
      "load",
      function () {
        navigator.serviceWorker.register(
          "./service-worker.js"
        );
      }
    );
  }


  window.showProduct =
    showProduct;

  window.setShellLanguage =
    setShellLanguage;
</script>
</body>
</html>
